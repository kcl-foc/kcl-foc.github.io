# ---------------------------------------------------------------------------
# All text that appears on the site is configured here.
#
#   _data/site.yml               <- this file: every heading, label and paragraph
#   _data/people.yml             <- organisers, members, secondary members
#   _data/news.yml               <- group news items (optional section)
#   _data/talks.yml              <- seminar talks
#
# Paragraph fields (description, intro, etc.) support markdown: links,
# **bold**, *italic*, and blank-line-separated paragraphs.
# ---------------------------------------------------------------------------

# Shown at the top of every page.
#   title    -> the large heading
#   tagline  -> small line under the heading. Each page can override it with
#               its own `tagline:` below; set to "" to hide it on that page.
#   subtitle -> affiliation lines beneath (a <br> splits the two lines)
title: "Foundations of Computing"
tagline: "Research Group"
subtitle: "Department of Informatics <br> King's College London"

# ------------------------------- Home page ---------------------------------
home:
  # Browser tab title for the home page. Also used by search engines, so it
  # spells out what the group is and where it sits.
  page_title: "Foundations of Computing — Research Group, Department of Informatics, King's College London"

  about:
    description: |
      The Foundations of Computing group investigates the mathematical and conceptual foundations of computation. Its research focuses on rigorous methods, and their formal analysis, that underpin computer science, artificial intelligence, and data analytics, including algorithms, complexity, logic, models of computation, optimisation, game theory, database theory, and rigorous methods that underpin computer science, data analytics, and artificial intelligence. 

      **Keywords**

        - Algorithms and Complexity 
        - Theoretical Computer Science 
        - Logic and Semantics 
        - Models of Computation 
        - Algorithmic Game Theory 
        - Computational Economics 
        - Database Theory 
        - Combinatorial Optimisation 
        - Algorithm Engineering 
        - Probabilistic Methods 

  # The News section is optional: it is hidden automatically when
  # _data/news.yml has no entries.
  news:
    heading: "News"
    intro: ""
    # Show at most this many items on the home page (0 or omitted = show all).
    limit: 3

  # The "People" section wraps the three lists below it.
  people:
    heading: "People"
    intro: ""

  organisers:
    heading: "Organisers"
    intro: ""

  members:
    heading: "Members"
    intro: ""

  secondary_members:
    heading: "Associate Members"
    intro: |
      Colleagues in the Department of Informatics whose research connects
      closely with the work of the group.

  seminar:
    heading: "Seminar Series"
    # Paragraph about the seminar series, shown on the home page.
    description: |
      The Foundations of Computing seminar brings together researchers from
      across the department and beyond to present new work on the theory of
      computation. Talks are open to everyone, students, postdocs and faculty
      are all very welcome, and no prior familiarity with the speaker's area is
      assumed.

    # Heading above the seminar organiser's contact details.
    organiser_heading: "Seminar organiser"

    # Heading above the short list of talks on the home page.
    upcoming_heading: "Next and most recent talks"

    # Text shown when no talks are listed in _data/talks.yml.
    no_talks: "No talks scheduled at the moment. Check back soon!"

    # Link to the full seminar page.
    link_text: "See all talks, upcoming and past"

# ------------------------------ Seminar page -------------------------------
seminar_page:
  # Browser tab title for the seminar page.
  page_title: "Seminar — Foundations of Computing, Department of Informatics, King's College London"

  # Main heading on the seminar page.
  heading: "Foundations of Computing Seminar"

  # Small line under the heading, overriding the site-wide tagline.
  tagline: "Research Group Seminar Series"

  # Introductory paragraph on the seminar page.
  description: |
    The Foundations of Computing seminar brings together researchers from
    across the department and beyond to present new work on the theory of
    computation. Talks are open to everyone — students, postdocs and faculty
    are all very welcome, and no prior familiarity with the speaker's area is
    assumed.

    Contact the seminar organiser if you would like to give a talk or be added
    to the mailing list.

  upcoming_heading: "Upcoming Talks"
  past_heading: "Past Talks"

  no_upcoming: "No upcoming talks scheduled at the moment. Check back soon!"
  no_past: "No past talks to show yet."

  # Link back to the group home page.
  back_link_text: "Back to the Foundations of Computing group"

# ------------------------------ Shared labels ------------------------------
labels:
  # Fallback shown when a talk has no abstract.
  abstract_coming_soon: "Abstract coming soon"
  # Talk link buttons.
  video_link: "Meeting Link"
  person_url: "Speaker Page"
  paper_url: "Paper"
  add_to_calendar: "Add to Calendar"
  # Default text for a news item's link, when the item sets no `link_text`.
  news_link: "Read more"
  # Member link buttons.
  website: "Website"
  kcl_profile: "KCL Profile"

# --------------------------------- Footer ----------------------------------
footer:
  # {email} is replaced with the address below.
  contact_text: "Contact [{email}](mailto:{email}) in case of issues."
  contact_email: "edwin.lock@kcl.ac.uk"
  copyright_year: "2026"
  copyright_holder: "Edwin Lock"
  rights_text: "All rights reserved."

# --------------------------- Password gate (optional) ----------------------
# A simple JavaScript prompt that hides the site from casual visitors.
#
# NOT SECURE: the page content is already in the HTML sent to the browser, so
# anyone using view-source, DevTools or curl can read it without the password.
# It only stops people glancing at an unfinished site. Do not put anything
# confidential on the page and rely on this.
#
# To change the password, generate the SHA-256 hash of the new one and paste it
# into password_hash below:
#
#   echo -n 'your-new-password' | shasum -a 256
#
# Set enabled: false to switch the gate off entirely.
gate:
  enabled: true
  # Current password: informatics
  password_hash: "22d46300d8f7749fcbbd6e69439c38ab10cf804e07f83a0381ff2c4b77daa396"
  heading: "Foundations of Computing"
  prompt: "This site is not public yet. Please enter the password to continue."
  button: "Enter"
  placeholder: "Password"
  error_message: "Incorrect password. Please try again."
  # Shown when the browser cannot hash the password (needs https or localhost).
  unavailable_message: "Password checking is unavailable in this browser."
