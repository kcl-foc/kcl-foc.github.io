# ---------------------------------------------------------------------------
# Everyone who appears on the site, in four groups. People are shown in the
# order they are listed here.
#
#   organisers         -> "Organisers" section on the home page
#   seminar_organiser  -> seminar organiser, on the home and seminar pages
#   members            -> "Members" section on the home page
#   secondary_members  -> "Associate Members" section on the home page
#
# Fields:
#   name         required
#   email        required
#   role         organisers and seminar_organiser only (e.g. "Group Head")
#   job_title    optional (members and secondary members)
#   website      optional; a personal homepage or KCL profile page, whichever
#                you would rather link to
#
# Section headings and intro text are configured in _data/site.yml.
# ---------------------------------------------------------------------------

